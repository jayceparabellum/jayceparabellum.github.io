name = "jayce-chat"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI: BGE embeddings + BGE reranker (free tier covers this site's traffic).
[ai]
binding = "AI"

# Per-IP limit: 12 questions per minute.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

# Site-wide cap across all visitors: 60 questions per minute (protects the API bill).
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Contact form: 3 messages per minute per IP.
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# Cache: passage embeddings and starter-question answers, keyed by KB version (no visitor text is stored).
[[kv_namespaces]]
binding = "CHAT_CACHE"
id = "9e62c9b7b8e7440686118564efc10367"

[vars]
# Hiring inquiries from the chat's contact form go here (via FormSubmit, or Resend if RESEND_API_KEY is set; never taken from requests).
CONTACT_TO = "jayce.n.parabellum@gmail.com"
ALLOWED_ORIGINS = "https://jayceparabellum.github.io,http://localhost:8000,http://127.0.0.1:8000"

# Secrets (never committed):
#   HISTORY_SECRET     required: random string that signs chat answers (see src/history.js)
#   ANTHROPIC_API_KEY  optional: use Claude Haiku instead of Llama on Workers AI
#   RESEND_API_KEY     optional: send contact mail through Resend instead of FormSubmit
